name: Unit tests
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e . pytest pytest-asyncio
      - run: pytest -q
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ovos_tts_plugin_polly/bridge/package-lock.json
      - run: npm ci --ignore-scripts --prefix ovos_tts_plugin_polly/bridge
      - run: node --test tests/bridge.test.mjs
